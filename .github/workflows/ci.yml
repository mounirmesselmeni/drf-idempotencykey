name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.1"
          - python-version: "3.11"
            django-version: "6.0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install project deps
        run: uv sync --group dev

      - name: Install Django matrix version
        run: uv pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run prek
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.4"
          extra-args: --all-files

      - name: Run lint
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        run: uv run ruff check .

      - name: Run test suite
        run: uv run python -m django test --settings=tests.settings

      - name: Check migrations
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        run: uv run python -m django makemigrations --check --dry-run --settings=tests.settings

      - name: Minimize uv cache
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        run: uv cache prune --ci

  publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'release' && github.event.action == 'published'

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
