name: CI

on:
  create:
    tags:
      - "*"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          - python-version: "3.11"
            django-version: "6.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Install Django
        run: uv run pip install "django~=${{ matrix.django-version }}"

      - name: Cache pre-commit hooks
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        id: pre-commit-cache
        uses: actions/cache@v4
        with:
          path: $HOME/.cache/pre-commit
          key: ${{ runner.os }}-${{ matrix.python-version }}-pre-commit-hooks-${{ hashFiles('**/.pre-commit-config.yaml') }}

      - name: Run pre-commit
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        run: uv run pre-commit run --all-files
        env:
          PRE_COMMIT_HOME: $HOME/.cache/pre-commit

      - name: Run tests
        run: uv run python -m django test --settings=tests.settings

      - name: Build package
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1'
        run: uv build

      - name: Publish package
        if: matrix.python-version == '3.14' && matrix.django-version == '6.1' && startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
