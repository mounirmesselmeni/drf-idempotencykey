[project]
name = "drf-idempotencykey"
version = "0.1.0"

description = "Reusable idempotency-key support for Django REST Framework APIs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mounir Messelmeni", email = "messelmeni.mounir@gmail.com" },
]
keywords = ["django", "drf", "rest-framework", "idempotency", "api", "http"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["Django>=5.2", "djangorestframework>=3.15"]

[project.optional-dependencies]
celery = ["celery>=5.3"]

[project.urls]
Homepage = "https://github.com/mounirmesselmeni/drf-idempotencykey"
Repository = "https://github.com/mounirmesselmeni/drf-idempotencykey"
Issues = "https://github.com/mounirmesselmeni/drf-idempotencykey/issues"

[dependency-groups]
dev = [
    "coverage>=7,<8",
    "factory-boy>=3.2,<4",
    "pre-commit>=3,<5",
    "ruff>=0.6,<0.17",
    "time-machine>=2.15,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drf_idempotencykey"]
include = ["/src/drf_idempotencykey/py.typed"]

[tool.hatch.build.targets.sdist]
include = [
    "src/drf_idempotencykey",
    "tests",
    "README.md",
    "LICENSE",
    ".pre-commit-config.yaml",
]
exclude = ["tests/.coverage"]

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pre-commit-cache",
    ".ruff_cache",
    ".tox",
    ".cache",
    ".venv",
    "venv",
    "__pycache__",
    "**/migrations/*",
]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "B",
    "C4",
    "EXE",
    "ISC",
    "ICN",
    "INP",
    "PIE",
    "SIM",
    "W",
    "T20",
    "UP",
    "T10",
    "G",
    "DJ001",
    "DJ008",
    "C90",
    "ERA",
]
ignore = ["B008", "SIM102", "ISC001"]
fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10
